[project]
name = "odin-zapros"
version = "0.1.0"
description = "AI-агент «О!дин запрос» — Ostrovok Tech Hackathon 2026"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "httpx>=0.27",
    "openai>=1.50",
    "streamlit>=1.40",
    "langgraph>=1.2,<2",
    "langfuse>=5.0.4,<6",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
