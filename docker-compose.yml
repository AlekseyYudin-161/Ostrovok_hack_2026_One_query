# Запуск: docker compose up --build → интерфейс http://localhost:8080, API http://localhost:8000/health
# Без .env агент работает офлайн (разбор запроса правилами); с ключом LLM в .env — через модель.

services:
  api:
    build: .
    platform: linux/amd64
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - path: .env
        required: false
    environment:
      AGENT_BACKEND: graph
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  app:
    build: .
    platform: linux/amd64
    env_file:
      - path: .env
        required: false
    environment:
      AGENT_BACKEND: http
      API_URL: http://api:8000
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/_stcore/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
